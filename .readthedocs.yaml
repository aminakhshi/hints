# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    # nbsphinx executes the pandoc binary to convert notebook markdown. The
    # pandoc entry in docs/requirements.txt is only a Python wrapper and does
    # not provide it.
    - pandoc

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#    - pdf
#    - epub

# Declare the Python requirements needed to build the documentation. The
# package itself is installed so that autodoc can import it; without this the
# API reference is generated empty.
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
